name: Docker Image CI

on:
  push:
    branches: [ "feature/docker-for-ario" ]
  pull_request:
    branches: [ "feature/docker-for-ario" ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build the Docker image
      run: docker build . --file Dockerfile --tag ario-openclaw:$(date +%s)
